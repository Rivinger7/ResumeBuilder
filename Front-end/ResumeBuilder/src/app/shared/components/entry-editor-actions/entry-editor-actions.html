<div class="flex justify-between gap-3 border-t border-gray-200 pt-4">
  <button
    type="button"
    (click)="cancel.emit()"
    class="cursor-pointer rounded-md border border-gray-300 px-4 py-2 text-sm font-bold w-full"
  >
    Cancel
  </button>
  <button
    type="button"
    (click)="save.emit()"
    class="cursor-pointer rounded-md bg-[#1B3A5C] px-4 py-2 text-sm font-bold text-white hover:opacity-90 w-full"
  >
    Done
  </button>
</div>
