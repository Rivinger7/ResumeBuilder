<div
  class="flex flex-wrap gap-2"
  [class.grid]="columns() > 0"
  [style.grid-template-columns]="columns() > 0 ? 'repeat(' + columns() + ', 1fr)' : ''"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      (click)="select(option)"
      class="flex cursor-pointer items-center justify-center gap-2 rounded-lg border-2 transition-colors"
      [class.border-indigo-500]="option.value === value()"
      [class.bg-indigo-50]="option.value === value()"
      [class.border-gray-200]="option.value !== value()"
      [class.hover:border-gray-300]="option.value !== value()"
      [class.px-4]="size() === 'md'"
      [class.py-3]="size() === 'md'"
      [class.px-3]="size() === 'sm'"
      [class.py-2]="size() === 'sm'"
    >
      @if (option.icon) {
        <lucide-icon
          [name]="option.icon"
          [size]="size() === 'md' ? 18 : 14"
          [class.text-indigo-600]="option.value === value()"
          [class.text-gray-500]="option.value !== value()"
        />
      }
      @if (option.preview) {
        <img [src]="option.preview" alt="" class="h-6" />
      }
      @if (option.label) {
        <span
          class="text-sm font-medium"
          [class.text-indigo-600]="option.value === value()"
          [class.text-gray-600]="option.value !== value()"
        >
          {{ option.label }}
        </span>
      }
    </button>
  }
</div>
