<div class="flex flex-wrap gap-2">
  @for (option of options(); track option.value) {
    <button
      type="button"
      (click)="select(option)"
      [title]="option.label ?? ''"
      class="flex size-10 cursor-pointer items-center justify-center rounded-full border-2 transition-colors"
      [class.border-indigo-500]="option.value === value()"
      [class.bg-indigo-50]="option.value === value()"
      [class.border-gray-200]="option.value !== value()"
      [class.hover:border-gray-300]="option.value !== value()"
    >
      <lucide-icon
        [name]="option.icon"
        size="16"
        [class.text-indigo-600]="option.value === value()"
        [class.text-gray-500]="option.value !== value()"
      />
    </button>
  }
</div>
