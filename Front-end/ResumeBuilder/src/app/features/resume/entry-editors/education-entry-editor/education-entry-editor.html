<div class="flex flex-col gap-y-4">
  <div class="flex flex-col gap-y-4 rounded-lg border border-gray-200 bg-white p-5">
    <p class="text-lg font-bold">Edit Entry</p>

    <form [formGroup]="form" class="flex flex-col gap-y-4">
      <div class="grid grid-cols-2 gap-3">
        <app-form-field label="School name">
          <input formControlName="title" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
        </app-form-field>
        <app-form-field label="Degree">
          <input formControlName="degree" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
        </app-form-field>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <app-form-field label="Major">
          <input formControlName="major" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
        </app-form-field>
        <app-form-field label="GPA">
          <input
            formControlName="gpa"
            type="number"
            step="0.01"
            class="rounded-md bg-gray-100 px-3 py-2 text-sm"
          />
        </app-form-field>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <app-form-field label="Start date">
          <input
            formControlName="startDate"
            type="month"
            class="rounded-md bg-gray-100 px-3 py-2 text-sm"
          />
        </app-form-field>
        <app-form-field label="End date">
          <input
            formControlName="endDate"
            type="month"
            class="rounded-md bg-gray-100 px-3 py-2 text-sm"
          />
        </app-form-field>
        <app-form-field label="Location">
          <input formControlName="location" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
        </app-form-field>
      </div>

      <label class="flex items-center gap-2">
        <input formControlName="isCurrent" type="checkbox" />
        <span class="text-sm">Currently studying here</span>
      </label>

      <app-rich-text-field label="Description" formControlName="description" />
    </form>

    <app-entry-editor-actions (cancel)="cancel()" (save)="save()" />
  </div>

  <div class="overflow-hidden rounded-lg border border-gray-200 bg-white">
    <button
      type="button"
      (click)="toggleCustomization()"
      class="flex w-full cursor-pointer items-center gap-2 px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-50"
      [class.border-b]="isStyleCustomizationVisible()"
      [class.border-gray-200]="isStyleCustomizationVisible()"
    >
      <lucide-icon [name]="'settings-2'" size="16" />
      {{ isStyleCustomizationVisible() ? 'Hide' : 'Show' }} customizations for this section
      <lucide-icon
        [name]="'chevron-down'"
        size="14"
        class="ml-auto transition-transform"
        [class.rotate-180]="isStyleCustomizationVisible()"
      />
    </button>

    @if (isStyleCustomizationVisible()) {
      <app-education-customization-panel
        [customization]="customization()"
        (customizationChange)="onCustomizationChange($event)"
      />
    }
  </div>
</div>
