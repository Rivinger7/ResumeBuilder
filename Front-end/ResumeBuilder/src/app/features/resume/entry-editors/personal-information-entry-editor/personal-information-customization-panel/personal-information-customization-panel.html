<div class="flex flex-col gap-y-5 bg-gray-50 p-5">
  <h3 class="text-lg font-bold">Header</h3>

  <div class="flex flex-col gap-y-2">
    <span class="text-sm font-semibold">Text Alignment</span>
    <app-toggle-button-group
      [options]="alignmentOptions"
      [value]="customization().textAlignment"
      (changed)="emitChange({ textAlignment: $event })"
    />
  </div>

  <div class="flex flex-col gap-y-2">
    <span class="text-sm font-semibold">Details Arrangement</span>
    <app-toggle-button-group
      [options]="layoutOptions"
      [value]="customization().layout"
      [columns]="2"
      (changed)="emitChange({ layout: $event })"
    />
    <app-toggle-button-group
      [options]="markerOptions"
      [value]="customization().markerStyle"
      [columns]="3"
      size="sm"
      (changed)="emitChange({ markerStyle: $event })"
    />
  </div>

  @if (showIconStyles()) {
    <div class="flex flex-col gap-y-2">
      <span class="text-sm font-semibold">Icon Style</span>
      <app-swatch-grid
        [options]="iconStyleOptions"
        [value]="customization().iconStyle"
        (changed)="emitChange({ iconStyle: $event })"
      />
    </div>
  }
</div>
