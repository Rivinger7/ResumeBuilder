<div class="flex flex-col gap-y-4 rounded-lg border border-gray-200 bg-white p-5">
  <p class="text-lg font-bold">Edit Entry</p>

  <form [formGroup]="form" class="flex flex-col gap-y-4">
    <div class="flex flex-col items-center gap-y-1">
      <span class="text-sm font-bold">Photo</span>
      <label
        class="relative flex size-24 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-gray-100 hover:opacity-90"
      >
        @if (isUploadingPhoto()) {
          <span class="text-xs text-gray-500">Uploading...</span>
        } @else if (photoPreviewUrl(); as photoUrl) {
          <img [src]="photoUrl" alt="" class="h-full w-full object-cover" />
        } @else {
          <lucide-icon [name]="'camera'" size="24" class="text-gray-400" />
        }
        <input
          type="file"
          accept="image/png,image/jpeg,image/webp"
          class="hidden"
          (change)="onPhotoSelected($event)"
        />
      </label>
    </div>

    <app-form-field label="Full name">
      <input formControlName="title" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
    </app-form-field>
    <app-form-field label="Professional title">
      <input formControlName="subTitle" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
    </app-form-field>
    <div class="grid grid-cols-2 gap-3">
      <app-form-field label="Email">
        <input formControlName="email" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
      </app-form-field>
      <app-form-field label="Phone">
        <input formControlName="phoneNumber" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
      </app-form-field>
    </div>
    <app-form-field label="Address">
      <input formControlName="address" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
    </app-form-field>
    <div class="grid grid-cols-3 gap-3">
      <app-form-field label="Website">
        <input formControlName="website" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
      </app-form-field>
      <app-form-field label="LinkedIn">
        <input formControlName="linkedin" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
      </app-form-field>
      <app-form-field label="GitHub">
        <input formControlName="github" class="rounded-md bg-gray-100 px-3 py-2 text-sm" />
      </app-form-field>
    </div>
  </form>

  <app-entry-editor-actions (cancel)="cancel()" (save)="save()" />
</div>
