<main class="min-h-screen bg-[#F7F4EE] px-4 pt-4">
  <div class="flex flex-col gap-y-10">
    <div class="flex flex-col gap-y-1">
      <p class="text-2xl font-bold">My Resumes</p>
      <p class="text-[20px] text-gray-500">
        Your first resume is free forever. Need more than one resume?
        <span class="underline font-medium">Upgrade your plan</span>
      </p>
    </div>
    <div class="grid grid-cols-4 gap-x-4 gap-y-8">
      <div class="flex flex-col rounded-lg" style="aspect-ratio: 200 / 240">
        <button
          type="button"
          (click)="createResume()"
          class="cursor-pointer appearance-none touch-manipulation focus-visible:outline-blue-600 font-bold flex h-full w-full flex-col items-center justify-center rounded-lg border-2 border-dashed border-gray-400 text-gray-500 hover:opacity-80"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16 16"
            fill="currentColor"
            class="w-5"
          >
            <path
              d="M15 7H9V1a1 1 0 00-2 0v6H1a1 1 0 000 2h6v6a1 1 0 102 0V9h6a1 1 0 100-2z"
            ></path></svg
          ><span class="mt-2 text-base font-bold">New resume</span>
        </button>
      </div>

      @for (resume of resumes(); track resume.id) {
        <div class="select-none">
          <div
            (click)="viewResume(resume.id)"
            class="group cursor-pointer select-none overflow-hidden rounded-md border border-solid border-white relative"
            style="aspect-ratio: 200 / 240"
          >
            <app-resume-thumbnail-preview [resume]="resume" class="block h-full w-full" />

            <div
              class="bg-white/90 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex flex-col items-center w-full h-full absolute inset-0"
            >
              <!-- View Resume -->
              <button
                class="flex flex-col items-center gap-1 text-neutral-900 absolute top-25 group-hover:cursor-pointer"
              >
                <span class="text-lg font-bold tracking-wide">VIEW RESUME</span>
                <lucide-icon [name]="ArrowRightIcon" class="w-4 h-4"></lucide-icon>
              </button>

              <!-- Divider -->
              <div
                class="w-1/2 border-t border-neutral-400 absolute bottom-25 text-2xl font-bold"
              ></div>

              <!-- Duplicate -->
              <!-- Todo: Function does not work -->
              <button
                class="flex items-center gap-1.5 text-neutral-900 absolute bottom-10 group-hover:cursor-pointer"
              >
                <span class="text-lg font-bold tracking-wide">DUPLICATE</span>
                <lucide-icon [name]="FilesIcon" class="w-3.5 h-3.5"></lucide-icon>
              </button>
            </div>
          </div>
          <div class="flex flex-row justify-between mt-2 relative">
            <div class="flex flex-col gap-y-2">
              <p class="text-xl font-bold">{{ resume.title }}</p>
              <p class="text-sm text-gray-500 font-medium">{{ resume.status }}</p>
            </div>
            <div class="absolute top-4 right-0">
              <button
                type="button"
                (click)="deleteResume(resume.id, $event)"
                class="cursor-pointer"
              >
                <lucide-icon class="text-gray-500" [name]="EllipsisVerticalIcon"></lucide-icon>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</main>
